name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小权限:测试只需要读代码(默认 token 权限随仓库设置漂移,显式钉住)
permissions:
  contents: read

# 同一分支的新提交取消上一次运行,省 runner、避免旧 commit 的红/绿干扰判断
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu 固定 24.04:ubuntu-latest 自 2026-10 起迁 26.04,不锁会被静默换底座
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock
      - name: 安装依赖(先验证 requirements.txt 自足,再用 lock 锁版本防漂移)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements.lock
      - name: 依赖一致性(pip check:声明冲突/缺依赖在新环境立刻暴露)
        run: python -m pip check
      - name: 测试(离线,FakeLLM 驱动,不需要 .env 与内网)
        run: python -X utf8 -m pytest tests -q --junitxml=pytest-report.xml
      - name: 冒烟(真起 uvicorn 进程 + 请求 /health,验证部署形态可启动)
        run: python -X utf8 scripts/smoke_http.py
      - name: 上传测试报告(失败也留证据)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ matrix.os }}
          path: pytest-report.xml
          if-no-files-found: ignore
          retention-days: 14